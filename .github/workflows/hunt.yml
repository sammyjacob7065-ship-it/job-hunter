name: hunt
on:
  schedule:
    - cron: "17 4-23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: hunt
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "job-hunter (2)/job-hunter"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Install browser (only if a browser source is configured)
        run: |
          if grep -q '"browser_sources": \[ *\]' config.json; then echo skip; else pip install playwright && playwright install --with-deps chromium; fi
      - run: python hunter.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Save state
        run: |
          git config user.name hunter; git config user.email hunter@users.noreply.github.com
          git add state; git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
