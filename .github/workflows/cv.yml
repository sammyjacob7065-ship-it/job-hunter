name: cv
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "Job id from the Telegram message (the code under the link)", required: false }
      url:    { description: "OR paste any job page link", required: false }
permissions:
  contents: write
concurrency: drafts
jobs:
  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "job-hunter (2)/job-hunter"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests playwright && playwright install --with-deps chromium
      - run: |
          if [ -n "$JOB_ID" ]; then python cv.py --job-id "$JOB_ID"; else python cv.py --url "$JOB_URL"; fi
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB_URL: ${{ inputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: cv, path: "job-hunter (2)/job-hunter/out/" }
      - name: Save draft
        run: |
          git config user.name hunter; git config user.email hunter@users.noreply.github.com
          git add state; git diff --cached --quiet || (git commit -m "draft" && git pull --rebase && git push)
