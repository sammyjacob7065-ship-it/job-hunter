name: cv
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "Job id from the Telegram message (the code under the link)", required: false }
      url:    { description: "OR paste any job page link", required: false }
jobs:
  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests playwright && playwright install --with-deps chromium
      - run: |
          if [ -n "${{ inputs.job_id }}" ]; then python cv.py --job-id "${{ inputs.job_id }}"; else python cv.py --url "${{ inputs.url }}"; fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: cv, path: out/ }
